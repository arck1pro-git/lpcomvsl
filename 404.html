<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ARI — Ativo de Renda Imobiliária | Arck1Pro</title>

  <!-- Endereço que não existe no domínio (link digitado errado, caminho
       antigo, barra a mais) não mostra erro: leva direto para a LP. As
       UTMs e o fbclid seguem junto — sem eles o lead perde a origem e a
       Meta não liga a visita ao clique no anúncio. Sem pixel aqui: o
       PageView sai na LP, depois do redirecionamento. -->
  <script>
    location.replace('/' + location.search + location.hash);
  </script>
  <!-- Só sem JavaScript: com ele, um segundo redirecionamento competiria
       com o de cima e poderia levar a pessoa sem as UTMs. -->
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body>
  <p><a href="/">Ir para a página do ARI</a></p>
</body>
</html>
